name: Tests

# push is limited to main so PR commits run once (as pull_request), not twice.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Floor and ceiling of the supported range; conftest.py pins the CPU backend.
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        # [experiments] carries optuna, which tests/test_bayesian_tuner.py imports.
        # [tfds] and [viz] are omitted: the tests that need them call
        # pytest.importorskip, and their wheels dominate install time.
        run: |
          python -m pip install -U pip
          pip install -e ".[dev,experiments]"
      - name: Run tests
        run: pytest -q
